name: CI Pipeline

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pytest

    - name: Run tests
      run: |
        pytest
        
    - name: Build Artifact
      run: |
        echo "Building versioned artifact"

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment"

    - name: Smoke Tests
      run: |
        echo "Running smoke tests on staging"
